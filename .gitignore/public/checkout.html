<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPE DEPOT UK | Shopping Basket & Checkout</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f5f7; color: #333; }
        a { text-decoration: none; color: inherit; }
        .main-header { background-color: #fff; padding: 15px 20px; border-bottom: 2px solid #e1e4e8; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 26px; font-weight: 900; color: #d32f2f; }
        .logo span { color: #1a252f; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .box { background: white; padding: 20px; border-radius: 6px; border: 1px solid #e0e0e0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .cart-item:last-child { border-bottom: none; }
        .remove-btn { color: #d32f2f; font-weight: bold; cursor: pointer; font-size: 13px; }
        .summary-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #d32f2f; padding-bottom: 5px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .total-row { font-size: 18px; font-weight: bold; border-top: 1px solid #ddd; padding-top: 10px; color: #d32f2f; }
        .checkout-btn { width: 100%; background-color: #2e7d32; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 15px; }
        .empty-msg { text-align: center; padding: 30px; font-size: 16px; color: #666; }
    </style>
</head>
<body>

    <div class="main-header">
        <a href="index.html" class="logo">PPE DEPOT <span>UK</span></a>
        <a href="index.html" style="color: #d32f2f; font-weight: bold;">&larr; Continue Shopping</a>
    </div>

    <div class="container">
        <!-- Basket Items List -->
        <div class="box">
            <h2 style="margin-bottom: 15px;">Your Shopping Basket</h2>
            <div id="cart-list"></div>
        </div>

        <!-- Order Summary & Checkout -->
        <div class="box">
            <div class="summary-title">Order Summary</div>
            <div class="summary-row"><span>Subtotal:</span> <span id="subtotal">£0.00</span></div>
            <div class="summary-row"><span>Delivery:</span> <span>£3.25</span></div>
            <div class="summary-row total-row"><span>Total:</span> <span id="grand-total">£0.00</span></div>
            <button class="checkout-btn" onclick="processOrder()">Complete Purchase</button>
        </div>
    </div>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('ppe_cart')) || [];
            const container = document.getElementById('cart-list');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-msg">Your basket is empty.</div>';
                document.getElementById('subtotal').innerText = '£0.00';
                document.getElementById('grand-total').innerText = '£0.00';
                return;
            }

            container.innerHTML = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                container.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.title}</strong><br>
                            <small>£${item.price.toFixed(2)} x ${item.quantity}</small>
                        </div>
                        <div>
                            <strong>£${itemTotal.toFixed(2)}</strong>
                            <div class="remove-btn" onclick="removeItem(${index})">Remove</div>
                        </div>
                    </div>
                `;
            });

            const delivery = 3.25;
            document.getElementById('subtotal').innerText = `£${subtotal.toFixed(2)}`;
            document.getElementById('grand-total').innerText = `£${(subtotal + delivery).toFixed(2)}`;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('ppe_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('ppe_cart', JSON.stringify(cart));
            renderCart();
        }

        function processOrder() {
    const cart = JSON.parse(localStorage.getItem('ppe_cart')) || [];
    
    if (cart.length === 0) {
        alert('Your basket is empty!');
        return;
    }

    // Clear the cart so items don't remain after payment
    localStorage.removeItem('ppe_cart');

    // Paste your payment link inside the quotes below:
    const paymentLink = "https://buy.stripe.com/bJe9ASbF2byMd6U0MEcfK01";

    // Redirect user to payment portal
    window.location.href = paymentLink;
}
        

        renderCart();
    </script>
</body>
</html>
